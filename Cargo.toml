[package]
name = "spotify-tui"
version = "0.1.0"
edition = "2024"
default-run = "spotify-tui"
description = "A local-first Spotify controller and visualizer for spotifyd"
license = "MIT"
repository = "https://github.com/kylescudder/spotify-tui"
homepage = "https://github.com/kylescudder/spotify-tui"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
toml = "1.1.5"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
